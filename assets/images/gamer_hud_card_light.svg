<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 170" width="100%" height="170" fill="none">
  <defs>
    <!-- Esports Mecha Gradients -->
    <linearGradient id="mechaBorderLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#7c3aed" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="xpBarGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="mechaGlowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .gamer-title-light {
        font-family: 'Rajdhani', 'Outfit', 'Segoe UI', sans-serif;
        font-weight: 800;
        letter-spacing: 2.5px;
        fill: #0f172a;
      }
      .gamer-sub-light {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 1.2px;
      }
      .pulse-ring-light {
        animation: ringPulseLight 2.5s ease-out infinite;
      }
      .scan-sweep-light {
        animation: sweepAnimLight 4s linear infinite;
        transform-origin: 52px 85px;
      }
      .xp-flow-light {
        animation: xpPulseLight 2s ease-in-out infinite alternate;
      }
      .beacon-dot-light {
        animation: beaconBlinkLight 1s infinite alternate;
      }
      @keyframes ringPulseLight {
        0% { transform: scale(0.9); opacity: 0.8; }
        50% { transform: scale(1.08); opacity: 0.35; }
        100% { transform: scale(0.9); opacity: 0.8; }
      }
      @keyframes sweepAnimLight {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes xpPulseLight {
        0% { opacity: 0.9; }
        100% { opacity: 1; filter: drop-shadow(0 0 6px #0284c7); }
      }
      @keyframes beaconBlinkLight {
        0% { opacity: 0.3; }
        100% { opacity: 1; filter: drop-shadow(0 0 4px #059669); }
      }
    </style>
  </defs>

  <!-- Card Background: Cleanroom White/Glass with Mecha Cobalt Border (Zero Black Blocks!) -->
  <rect x="2" y="2" width="536" height="166" rx="12" fill="#ffffff" fill-opacity="0.9" stroke="url(#mechaBorderLight)" stroke-width="1.8" filter="url(#mechaGlowLight)" />
  
  <!-- Cyber HUD Diagonal Tech Cutout lines -->
  <path d="M 16 2 L 2 16" stroke="#0284c7" stroke-width="2.5" />
  <path d="M 524 2 L 538 16" stroke="#0284c7" stroke-width="2.5" />
  <path d="M 2 154 L 16 168" stroke="#7c3aed" stroke-width="2.5" />
  <path d="M 524 168 L 538 154" stroke="#7c3aed" stroke-width="2.5" />

  <!-- Left Side: Player Class Radar / Hologram Reticle -->
  <g transform="translate(18, 0)">
    <!-- Base Rings -->
    <circle cx="52" cy="85" r="42" stroke="rgba(2, 132, 199, 0.3)" stroke-width="1.2" stroke-dasharray="6 4" />
    <circle cx="52" cy="85" r="32" stroke="rgba(124, 58, 237, 0.35)" stroke-width="1" />
    <circle cx="52" cy="85" r="22" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.8" class="pulse-ring-light" />
    
    <!-- Radar Sweep Needle -->
    <line x1="52" y1="85" x2="52" y2="45" stroke="#0284c7" stroke-width="2" class="scan-sweep-light" />
    <circle cx="52" cy="85" r="4" fill="#0284c7" filter="url(#mechaGlowLight)" />

    <!-- Class Icon: Controller / Swords Cross -->
    <text x="52" y="90" font-family="'Segoe UI Emoji', sans-serif" font-size="16" text-anchor="middle" fill="#0f172a">⚔️</text>
    
    <!-- Level Badge -->
    <rect x="20" y="134" width="64" height="18" rx="4" fill="rgba(2, 132, 199, 0.12)" stroke="#0284c7" stroke-width="1.2" />
    <text x="52" y="147" font-family="'Fira Code', monospace" font-size="9" font-weight="bold" fill="#0284c7" text-anchor="middle">LVL 99</text>
  </g>

  <!-- Right Side: Player Data & RPG Battlestation Telemetry -->
  <g transform="translate(132, 16)">
    <!-- Top Gamer Tag & Status -->
    <text x="0" y="16" class="gamer-title-light" font-size="18">
      VISHNUPRIYAN <tspan fill="#7c3aed" font-size="13">&lt;ESPORTS/&gt;</tspan>
    </text>
    
    <!-- PVP / Co-Op Online Beacon -->
    <rect x="290" y="3" width="94" height="18" rx="4" fill="rgba(5, 150, 105, 0.12)" stroke="#059669" stroke-width="1.2" />
    <circle cx="300" cy="12" r="3" fill="#059669" class="beacon-dot-light" />
    <text x="308" y="16" font-family="'Fira Code', monospace" font-size="8.5" font-weight="bold" fill="#059669">CO-OP ONLINE</text>

    <!-- Subtitle: Player Class -->
    <text x="0" y="36" class="gamer-sub-light" fill="#0284c7">
      CLASS: <tspan fill="#1e293b" font-weight="bold">BACKEND TANK &amp; FULL-STACK ARCHITECT</tspan>
    </text>

    <!-- Combat Stat Matrix -->
    <g transform="translate(0, 48)">
      <!-- PHP / CodeIgniter Core Stat -->
      <rect x="0" y="0" width="88" height="22" rx="4" fill="rgba(2, 132, 199, 0.08)" stroke="rgba(2, 132, 199, 0.35)" stroke-width="1" />
      <text x="8" y="15" font-family="'Fira Code', monospace" font-size="9" fill="#475569">ATK: <tspan fill="#0284c7" font-weight="bold">98 (PHP)</tspan></text>

      <!-- MySQL Defense Stat -->
      <rect x="96" y="0" width="92" height="22" rx="4" fill="rgba(217, 119, 6, 0.08)" stroke="rgba(217, 119, 6, 0.35)" stroke-width="1" />
      <text x="104" y="15" font-family="'Fira Code', monospace" font-size="9" fill="#475569">DEF: <tspan fill="#d97706" font-weight="bold">95 (SQL)</tspan></text>

      <!-- BotOS / AI Mana Stat -->
      <rect x="196" y="0" width="98" height="22" rx="4" fill="rgba(124, 58, 237, 0.08)" stroke="rgba(124, 58, 237, 0.35)" stroke-width="1" />
      <text x="204" y="15" font-family="'Fira Code', monospace" font-size="9" fill="#475569">MANA: <tspan fill="#7c3aed" font-weight="bold">99 (AI)</tspan></text>

      <!-- JS UI Speed Stat -->
      <rect x="302" y="0" width="82" height="22" rx="4" fill="rgba(5, 150, 105, 0.08)" stroke="rgba(5, 150, 105, 0.35)" stroke-width="1" />
      <text x="310" y="15" font-family="'Fira Code', monospace" font-size="9" fill="#475569">SPD: <tspan fill="#059669" font-weight="bold">94 (JS)</tspan></text>
    </g>

    <!-- Experience Gauge (XP Progress Bar) -->
    <g transform="translate(0, 84)">
      <text x="0" y="10" font-family="'Fira Code', monospace" font-size="9" font-weight="600" fill="#475569">
        EXP PROGRESS: <tspan fill="#d97706" font-weight="bold">9,850 / 10,000 XP</tspan> <tspan fill="#64748b">(NEXT LEVEL: 99.5%)</tspan>
      </text>
      
      <!-- Bar Track -->
      <rect x="0" y="16" width="384" height="8" rx="4" fill="#e2e8f0" />
      <!-- Glowing Bar Progress -->
      <rect x="0" y="16" width="350" height="8" rx="4" fill="url(#xpBarGradLight)" class="xp-flow-light" />
    </g>

    <!-- Quest Status / Philosophy -->
    <text x="0" y="128" font-family="'Fira Code', monospace" font-size="9" fill="#64748b">
      &gt; MAIN QUEST: <tspan fill="#0284c7" font-weight="bold">BotOS Atom AI Action Engine</tspan> &middot; PASSIVE: <tspan fill="#d97706">Yali Guardian</tspan>
    </text>
  </g>
</svg>
