<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 32" width="100%" height="32" fill="none">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="25%" stop-color="#00f0ff" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#00f0ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .laser-pulse {
        animation: pulseFlow 3s ease-in-out infinite;
      }
      .node-blink {
        animation: nodeBlink 1.5s ease-in-out infinite alternate;
      }
      .bracket-flow {
        animation: bracketShift 4s ease-in-out infinite alternate;
      }
      @keyframes pulseFlow {
        0% { transform: translateX(-400px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(900px); opacity: 0; }
      }
      @keyframes nodeBlink {
        0% { opacity: 0.3; transform: scale(0.8); }
        100% { opacity: 1; transform: scale(1.3); filter: drop-shadow(0 0 6px #00f0ff); }
      }
      @keyframes bracketShift {
        0% { transform: scaleX(0.96); opacity: 0.7; }
        100% { transform: scaleX(1.02); opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background Base Circuit Track -->
  <path d="M 0 16 L 380 16 L 395 24 L 505 24 L 520 16 L 900 16" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1.5" />
  
  <!-- Glowing Center Track -->
  <path d="M 150 16 L 380 16 L 395 24 L 505 24 L 520 16 L 750 16" stroke="url(#divGrad)" stroke-width="2" filter="url(#neonGlow)" class="bracket-flow" />

  <!-- Animated High-Speed Electric Laser Pulse -->
  <g class="laser-pulse">
    <ellipse cx="200" cy="16" rx="60" ry="2.5" fill="url(#pulseGrad)" filter="url(#neonGlow)" />
  </g>

  <!-- Center Diamond HUD Core -->
  <polygon points="450,18 456,24 450,30 444,24" fill="#f59e0b" filter="url(#neonGlow)" />
  <circle cx="450" cy="24" r="1.5" fill="#ffffff" />

  <!-- Circuit Flank Nodes -->
  <circle cx="395" cy="24" r="3" fill="#00f0ff" class="node-blink" style="transform-origin: 395px 24px;" />
  <circle cx="505" cy="24" r="3" fill="#00f0ff" class="node-blink" style="transform-origin: 505px 24px; animation-delay: 0.75s;" />

  <!-- Terminal Cyber Brackets -->
  <path d="M 20 10 L 10 16 L 20 22" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 880 10 L 890 16 L 880 22" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
