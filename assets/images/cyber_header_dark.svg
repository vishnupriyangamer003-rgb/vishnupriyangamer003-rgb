<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" width="100%" height="310" fill="none">
  <defs>
    <!-- Dark Cyberpunk Gradients -->
    <linearGradient id="neonGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="30%" stop-color="#7928ca" />
      <stop offset="70%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <linearGradient id="cyberBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#7928ca" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ff007f" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="laserBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="25%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="75%" stop-color="#ff007f" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="scanlineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="eqBarGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#7928ca" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ff007f" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="badgeDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1e1035" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neonBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur1" />
      <feGaussianBlur stdDeviation="10" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Background Tech Grid Pattern -->
    <pattern id="cyberGridDark" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="rgba(0, 240, 255, 0.08)" stroke-width="1" />
      <circle cx="0" cy="0" r="1.5" fill="rgba(0, 240, 255, 0.3)" />
      <circle cx="18" cy="18" r="0.8" fill="rgba(255, 0, 127, 0.2)" />
    </pattern>

    <style>
      @keyframes glitchMaster {
        0%, 100% { transform: translate(0, 0); }
        2% { transform: translate(-3px, 1px); }
        4% { transform: translate(3px, -1px); }
        6% { transform: translate(0, 0); }
        52% { transform: translate(0, 0); }
        54% { transform: translate(2px, -2px); }
        56% { transform: translate(-2px, 1px); }
        58% { transform: translate(0, 0); }
      }
      @keyframes glitchCyanGhost {
        0%, 100% { transform: translate(0, 0); opacity: 0.8; }
        2% { transform: translate(-4px, 1px); opacity: 1; }
        4% { transform: translate(4px, -1px); opacity: 0.8; }
        6% { transform: translate(0, 0); opacity: 0.8; }
      }
      @keyframes glitchPinkGhost {
        0%, 100% { transform: translate(0, 0); opacity: 0.8; }
        2% { transform: translate(4px, -1px); opacity: 1; }
        4% { transform: translate(-4px, 1px); opacity: 0.8; }
        6% { transform: translate(0, 0); opacity: 0.8; }
      }
      @keyframes verticalSweep {
        0% { transform: translateY(-40px); opacity: 0; }
        15% { opacity: 0.85; }
        85% { opacity: 0.85; }
        100% { transform: translateY(350px); opacity: 0; }
      }
      @keyframes spinCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinCCW {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes pulseGlowBeam {
        0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 4px #00f0ff); }
        50% { opacity: 1; filter: drop-shadow(0 0 16px #00f0ff) drop-shadow(0 0 28px #ff007f); }
      }
      @keyframes beaconBlink {
        0%, 100% { opacity: 0.35; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 10px #10b981); }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes dataStreamTravel {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }

      /* Audio Equalizer animations */
      @keyframes eq1 { 0%, 100% { height: 12px; y: 284px; } 50% { height: 38px; y: 258px; } }
      @keyframes eq2 { 0%, 100% { height: 28px; y: 268px; } 50% { height: 8px;  y: 288px; } }
      @keyframes eq3 { 0%, 100% { height: 18px; y: 278px; } 50% { height: 46px; y: 250px; } }
      @keyframes eq4 { 0%, 100% { height: 36px; y: 260px; } 50% { height: 15px; y: 281px; } }
      @keyframes eq5 { 0%, 100% { height: 10px; y: 286px; } 50% { height: 42px; y: 254px; } }

      .main-title {
        font-family: 'Rajdhani', 'Outfit', 'Segoe UI', 'Impact', sans-serif;
        font-weight: 900;
        letter-spacing: 14px;
        text-anchor: middle;
      }
      .mono-txt {
        font-family: 'Fira Code', 'Courier New', monospace;
      }
      .anim-glitch-master { animation: glitchMaster 3.5s infinite; }
      .anim-glitch-cyan { animation: glitchCyanGhost 3.5s infinite; }
      .anim-glitch-pink { animation: glitchPinkGhost 3.5s infinite; }
      .anim-pulse-beam { animation: pulseGlowBeam 2.5s ease-in-out infinite; }
      .anim-beacon { animation: beaconBlink 1.4s infinite; }
      .anim-sweep { animation: verticalSweep 4.5s linear infinite; }
      .anim-data-flow { stroke-dasharray: 40 120; animation: dataStreamTravel 3s linear infinite; }

      .spin-cw-left { transform-origin: 90px 155px; animation: spinCW 12s linear infinite; }
      .spin-ccw-left { transform-origin: 90px 155px; animation: spinCCW 8s linear infinite; }
      .spin-cw-right { transform-origin: 910px 155px; animation: spinCW 14s linear infinite; }
      .spin-ccw-right { transform-origin: 910px 155px; animation: spinCCW 9s linear infinite; }

      .eq-b1 { animation: eq1 0.8s ease-in-out infinite alternate; }
      .eq-b2 { animation: eq2 0.7s ease-in-out infinite alternate; }
      .eq-b3 { animation: eq3 0.9s ease-in-out infinite alternate; }
      .eq-b4 { animation: eq4 0.65s ease-in-out infinite alternate; }
      .eq-b5 { animation: eq5 0.85s ease-in-out infinite alternate; }
    </style>
  </defs>

  <!-- Deep Obsidian Cyber Base Container -->
  <rect x="2" y="2" width="996" height="306" rx="16" fill="#070a14" />
  
  <!-- Subtle Radial Gradient Vignette -->
  <radialGradient id="vignetteGrad" cx="50%" cy="50%" r="55%">
    <stop offset="0%" stop-color="#141c38" stop-opacity="0.6" />
    <stop offset="60%" stop-color="#0b1022" stop-opacity="0.8" />
    <stop offset="100%" stop-color="#05070e" stop-opacity="1" />
  </radialGradient>
  <rect x="2" y="2" width="996" height="306" rx="16" fill="url(#vignetteGrad)" />

  <!-- Animated High-Tech Grid Matrix Overlay -->
  <rect x="2" y="2" width="996" height="306" rx="16" fill="url(#cyberGridDark)" />

  <!-- Laser Scanline Sweep -->
  <g class="anim-sweep">
    <rect x="4" y="0" width="992" height="45" fill="url(#scanlineGrad)" />
    <line x1="4" y1="22" x2="996" y2="22" stroke="#00f0ff" stroke-width="1.8" stroke-opacity="0.8" />
  </g>

  <!-- Outer Cyber Armor Frame with Chamfered Corners -->
  <path d="M 36 2 L 964 2 L 998 36 L 998 274 L 964 308 L 36 308 L 2 274 L 2 36 Z" 
        fill="none" stroke="url(#cyberBorderGrad)" stroke-width="2.4" filter="url(#cyanGlow)" />

  <!-- Tech Accent Data Flow Guides -->
  <path d="M 50 2 L 950 2" stroke="#00f0ff" stroke-width="1.5" class="anim-data-flow" />
  <path d="M 950 308 L 50 308" stroke="#ff007f" stroke-width="1.5" class="anim-data-flow" />

  <!-- Corner Brackets & Mecha Chamfer Accents -->
  <!-- Top Left -->
  <path d="M 12 44 L 44 12" stroke="#00f0ff" stroke-width="3.5" />
  <path d="M 6 52 L 52 6" stroke="#ff007f" stroke-width="1.5" stroke-dasharray="3 3" />
  <circle cx="48" cy="16" r="2.5" fill="#00f0ff" />
  <!-- Top Right -->
  <path d="M 988 44 L 956 12" stroke="#00f0ff" stroke-width="3.5" />
  <path d="M 994 52 L 948 6" stroke="#ff007f" stroke-width="1.5" stroke-dasharray="3 3" />
  <circle cx="952" cy="16" r="2.5" fill="#00f0ff" />
  <!-- Bottom Left -->
  <path d="M 12 266 L 44 298" stroke="#ff007f" stroke-width="3.5" />
  <circle cx="48" cy="294" r="2.5" fill="#ff007f" />
  <!-- Bottom Right -->
  <path d="M 988 266 L 956 298" stroke="#00f0ff" stroke-width="3.5" />
  <circle cx="952" cy="294" r="2.5" fill="#00f0ff" />

  <!-- Top System Telemetry HUD Bar -->
  <g transform="translate(38, 28)">
    <!-- Terminal Prompt / Call Sign Badge -->
    <rect x="-8" y="-14" width="220" height="22" rx="4" fill="rgba(0, 240, 255, 0.08)" stroke="#00f0ff" stroke-width="1" />
    <text x="0" y="2" class="mono-txt" font-size="11" font-weight="700" fill="#00f0ff" letter-spacing="1.2">
      &gt; CALLSIGN: <tspan fill="#ffffff" font-weight="800">gamer003-rgb</tspan>
    </text>

    <!-- Center System Status Stream -->
    <text x="240" y="2" class="mono-txt" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">
      <tspan fill="#7928ca">|</tspan> BATTLESTATION: <tspan fill="#00f0ff">4.20 GHz</tspan> <tspan fill="#7928ca">|</tspan> XP: <tspan fill="#ff007f">9,999/10,000</tspan> <tspan fill="#7928ca">|</tspan> LVL: <tspan fill="#f59e0b">99 MAX</tspan>
    </text>

    <!-- Top Right Pulsing Beacon -->
    <g transform="translate(780, -2)">
      <circle cx="0" cy="0" r="5" fill="#10b981" class="anim-beacon" />
      <circle cx="0" cy="0" r="12" stroke="#10b981" stroke-width="1.2" fill="none">
        <animate attributeName="r" values="4;18" dur="1.8s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1;0" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="16" y="4" class="mono-txt" font-size="10.5" font-weight="800" fill="#10b981" letter-spacing="1.5">
        LIVE MATRIX: ONLINE
      </text>
    </g>
  </g>

  <!-- Left Rotating HUD Reticle -->
  <g>
    <!-- Outer Gyro Rings -->
    <circle cx="90" cy="155" r="54" stroke="rgba(0, 240, 255, 0.18)" stroke-width="1" stroke-dasharray="6 4" />
    <circle cx="90" cy="155" r="44" stroke="#00f0ff" stroke-width="2" stroke-dasharray="16 8 4 8" class="spin-cw-left" />
    <circle cx="90" cy="155" r="30" stroke="#ff007f" stroke-width="1.5" stroke-dasharray="14 10" class="spin-ccw-left" />
    
    <!-- Targeting Crosshairs -->
    <line x1="90" y1="112" x2="90" y2="198" stroke="rgba(0, 240, 255, 0.35)" stroke-width="1" />
    <line x1="47" y1="155" x2="133" y2="155" stroke="rgba(0, 240, 255, 0.35)" stroke-width="1" />
    <circle cx="90" cy="155" r="4.5" fill="#00f0ff" filter="url(#cyanGlow)" />
    
    <!-- Reticle Telemetry Badge -->
    <rect x="52" y="218" width="76" height="18" rx="4" fill="rgba(0, 240, 255, 0.12)" stroke="#00f0ff" stroke-width="1.2" />
    <text x="90" y="231" class="mono-txt" font-size="9" font-weight="800" fill="#00f0ff" text-anchor="middle" letter-spacing="1">RADAR LOCK</text>
  </g>

  <!-- Right Rotating HUD Reticle -->
  <g>
    <circle cx="910" cy="155" r="54" stroke="rgba(255, 0, 127, 0.18)" stroke-width="1" stroke-dasharray="6 4" />
    <circle cx="910" cy="155" r="44" stroke="#ff007f" stroke-width="2" stroke-dasharray="16 8 4 8" class="spin-cw-right" />
    <circle cx="910" cy="155" r="30" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="14 10" class="spin-ccw-right" />
    
    <line x1="910" y1="112" x2="910" y2="198" stroke="rgba(255, 0, 127, 0.35)" stroke-width="1" />
    <line x1="867" y1="155" x2="953" y2="155" stroke="rgba(255, 0, 127, 0.35)" stroke-width="1" />
    <circle cx="910" cy="155" r="4.5" fill="#ff007f" filter="url(#cyanGlow)" />
    
    <rect x="866" y="218" width="88" height="18" rx="4" fill="rgba(255, 0, 127, 0.12)" stroke="#ff007f" stroke-width="1.2" />
    <text x="910" y="231" class="mono-txt" font-size="9" font-weight="800" fill="#ff007f" text-anchor="middle" letter-spacing="1">ATOM AI BUS</text>
  </g>

  <!-- CENTERPIECE: ULTRA GLITCH ESPORTS TITLE -->
  <g transform="translate(500, 125)">
    <!-- Cyan Aberration Ghost Layer -->
    <text x="-4" y="0" class="main-title anim-glitch-cyan" font-size="62" fill="#00f0ff" opacity="0.9">
      VISHNUPRIYAN
    </text>
    <!-- Magenta Aberration Ghost Layer -->
    <text x="4" y="0" class="main-title anim-glitch-pink" font-size="62" fill="#ff007f" opacity="0.9">
      VISHNUPRIYAN
    </text>
    <!-- Master Crisp Core Lettering -->
    <text x="0" y="0" class="main-title anim-glitch-master" font-size="62" fill="#ffffff" filter="url(#neonBloom)">
      VISHNUPRIYAN
    </text>

    <!-- Laser Pulse Beam Divider -->
    <g class="anim-pulse-beam">
      <line x1="-340" y1="24" x2="340" y2="24" stroke="url(#laserBeamGrad)" stroke-width="3" />
      <polygon points="0,18 -10,24 0,30 10,24" fill="#00f0ff" filter="url(#cyanGlow)" />
      <circle cx="-170" cy="24" r="3.5" fill="#00f0ff" />
      <circle cx="170" cy="24" r="3.5" fill="#ff007f" />
    </g>

    <!-- Subtitle Role Telemetry -->
    <text x="0" y="52" class="mono-txt" font-size="12" font-weight="800" fill="#00f0ff" text-anchor="middle" letter-spacing="2">
      LEVEL 99 SENIOR FULL-STACK ARCHITECT <tspan fill="#ff007f">•</tspan> PHP CORE <tspan fill="#ff007f">•</tspan> AI SOLUTIONS
    </text>

    <!-- Interactive Combat Loadout Badges -->
    <g transform="translate(0, 78)">
      <!-- Badge 1: Backend Tank -->
      <g transform="translate(-270, 0)">
        <rect x="0" y="0" width="165" height="26" rx="6" fill="url(#badgeDarkBg)" stroke="#7928ca" stroke-width="1.4" />
        <text x="82.5" y="17.5" class="mono-txt" font-size="10.5" font-weight="800" fill="#c084fc" text-anchor="middle" letter-spacing="0.5">
          &#9876; BACKEND TANK
        </text>
      </g>

      <!-- Badge 2: BotOS Quest -->
      <g transform="translate(-90, 0)">
        <rect x="0" y="0" width="180" height="26" rx="6" fill="url(#badgeDarkBg)" stroke="#00f0ff" stroke-width="1.4" />
        <text x="90" y="17.5" class="mono-txt" font-size="10.5" font-weight="800" fill="#00f0ff" text-anchor="middle" letter-spacing="0.5">
          &#129302; QUEST: BotOS ACTION BUS
        </text>
      </g>

      <!-- Badge 3: Yali Philosophy -->
      <g transform="translate(105, 0)">
        <rect x="0" y="0" width="165" height="26" rx="6" fill="url(#badgeDarkBg)" stroke="#10b981" stroke-width="1.4" />
        <text x="82.5" y="17.5" class="mono-txt" font-size="10.5" font-weight="800" fill="#34d399" text-anchor="middle" letter-spacing="0.5">
          &#128006; YALI PHILOSOPHY
        </text>
      </g>
    </g>
  </g>

  <!-- Bottom Animated 32-Bar Audio Spectrum Equalizer -->
  <g transform="translate(140, 0)">
    <line x1="0" y1="298" x2="720" y2="298" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1" />
    
    <rect x="10"  y="280" width="12" height="18" rx="2.5" fill="url(#eqBarGrad)" class="eq-b1" />
    <rect x="32"  y="272" width="12" height="26" rx="2.5" fill="url(#eqBarGrad)" class="eq-b2" />
    <rect x="54"  y="285" width="12" height="13" rx="2.5" fill="url(#eqBarGrad)" class="eq-b3" />
    <rect x="76"  y="266" width="12" height="32" rx="2.5" fill="url(#eqBarGrad)" class="eq-b4" />
    <rect x="98"  y="276" width="12" height="22" rx="2.5" fill="url(#eqBarGrad)" class="eq-b5" />
    <rect x="120" y="260" width="12" height="38" rx="2.5" fill="url(#eqBarGrad)" class="eq-b1" />
    <rect x="142" y="282" width="12" height="16" rx="2.5" fill="url(#eqBarGrad)" class="eq-b2" />
    <rect x="164" y="270" width="12" height="28" rx="2.5" fill="url(#eqBarGrad)" class="eq-b3" />
    <rect x="186" y="278" width="12" height="20" rx="2.5" fill="url(#eqBarGrad)" class="eq-b4" />
    <rect x="208" y="258" width="12" height="40" rx="2.5" fill="url(#eqBarGrad)" class="eq-b5" />
    <rect x="230" y="284" width="12" height="14" rx="2.5" fill="url(#eqBarGrad)" class="eq-b1" />
    <rect x="252" y="268" width="12" height="30" rx="2.5" fill="url(#eqBarGrad)" class="eq-b2" />
    <rect x="274" y="274" width="12" height="24" rx="2.5" fill="url(#eqBarGrad)" class="eq-b3" />
    <rect x="296" y="254" width="12" height="44" rx="2.5" fill="url(#eqBarGrad)" class="eq-b4" />
    <rect x="318" y="250" width="12" height="48" rx="2.5" fill="url(#eqBarGrad)" class="eq-b5" />
    <rect x="340" y="262" width="12" height="36" rx="2.5" fill="url(#eqBarGrad)" class="eq-b1" />
    <rect x="362" y="262" width="12" height="36" rx="2.5" fill="url(#eqBarGrad)" class="eq-b1" />
    <rect x="384" y="250" width="12" height="48" rx="2.5" fill="url(#eqBarGrad)" class="eq-b5" />
    <rect x="406" y="254" width="12" height="44" rx="2.5" fill="url(#eqBarGrad)" class="eq-b4" />
    <rect x="428" y="274" width="12" height="24" rx="2.5" fill="url(#eqBarGrad)" class="eq-b3" />
    <rect x="450" y="268" width="12" height="30" rx="2.5" fill="url(#eqBarGrad)" class="eq-b2" />
    <rect x="472" y="284" width="12" height="14" rx="2.5" fill="url(#eqBarGrad)" class="eq-b1" />
    <rect x="494" y="258" width="12" height="40" rx="2.5" fill="url(#eqBarGrad)" class="eq-b5" />
    <rect x="516" y="278" width="12" height="20" rx="2.5" fill="url(#eqBarGrad)" class="eq-b4" />
    <rect x="538" y="270" width="12" height="28" rx="2.5" fill="url(#eqBarGrad)" class="eq-b3" />
    <rect x="560" y="282" width="12" height="16" rx="2.5" fill="url(#eqBarGrad)" class="eq-b2" />
    <rect x="582" y="260" width="12" height="38" rx="2.5" fill="url(#eqBarGrad)" class="eq-b1" />
    <rect x="604" y="276" width="12" height="22" rx="2.5" fill="url(#eqBarGrad)" class="eq-b5" />
    <rect x="626" y="266" width="12" height="32" rx="2.5" fill="url(#eqBarGrad)" class="eq-b4" />
    <rect x="648" y="285" width="12" height="13" rx="2.5" fill="url(#eqBarGrad)" class="eq-b3" />
    <rect x="670" y="272" width="12" height="26" rx="2.5" fill="url(#eqBarGrad)" class="eq-b2" />
    <rect x="692" y="280" width="12" height="18" rx="2.5" fill="url(#eqBarGrad)" class="eq-b1" />
  </g>
</svg>
