<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 170" width="100%" height="170" fill="none">
  <defs>
    <!-- RGB Neon Gradients -->
    <linearGradient id="rgbBorderDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="35%" stop-color="#ff007f" />
      <stop offset="70%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <linearGradient id="xpBarGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>

    <filter id="neonGlowRGB" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .gamer-title {
        font-family: 'Rajdhani', 'Outfit', 'Segoe UI', sans-serif;
        font-weight: 800;
        letter-spacing: 2.5px;
        fill: #ffffff;
      }
      .gamer-sub {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 1.2px;
      }
      .rgb-glow-text {
        animation: textFlicker 3s infinite alternate;
      }
      .pulse-ring {
        animation: ringPulse 2.5s ease-out infinite;
      }
      .scan-sweep {
        animation: sweepAnim 4s linear infinite;
        transform-origin: 52px 85px;
      }
      .xp-flow {
        animation: xpPulse 2s ease-in-out infinite alternate;
      }
      .beacon-dot {
        animation: beaconBlink 1s infinite alternate;
      }
      @keyframes textFlicker {
        0% { filter: drop-shadow(0 0 4px #00f0ff); opacity: 0.92; }
        50% { filter: drop-shadow(0 0 10px #ff007f); opacity: 1; }
        100% { filter: drop-shadow(0 0 6px #00f0ff); opacity: 0.95; }
      }
      @keyframes ringPulse {
        0% { transform: scale(0.9); opacity: 0.8; }
        50% { transform: scale(1.08); opacity: 0.3; }
        100% { transform: scale(0.9); opacity: 0.8; }
      }
      @keyframes sweepAnim {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes xpPulse {
        0% { opacity: 0.85; filter: drop-shadow(0 0 4px #00f0ff); }
        100% { opacity: 1; filter: drop-shadow(0 0 8px #10b981); }
      }
      @keyframes beaconBlink {
        0% { opacity: 0.2; }
        100% { opacity: 1; filter: drop-shadow(0 0 6px #10b981); }
      }
    </style>
  </defs>

  <!-- Card Background: Deep Cyber Translucent with Glowing Border (No Black Block!) -->
  <rect x="2" y="2" width="536" height="166" rx="12" fill="#0d1117" fill-opacity="0.75" stroke="url(#rgbBorderDark)" stroke-width="1.6" filter="url(#neonGlowRGB)" />
  
  <!-- Cyber HUD Diagonal Tech Cutout lines -->
  <path d="M 16 2 L 2 16" stroke="#00f0ff" stroke-width="2.5" />
  <path d="M 524 2 L 538 16" stroke="#00f0ff" stroke-width="2.5" />
  <path d="M 2 154 L 16 168" stroke="#ff007f" stroke-width="2.5" />
  <path d="M 524 168 L 538 154" stroke="#ff007f" stroke-width="2.5" />

  <!-- Left Side: Player Class Radar / Hologram Reticle -->
  <g transform="translate(18, 0)">
    <!-- Base Rings -->
    <circle cx="52" cy="85" r="42" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.2" stroke-dasharray="6 4" />
    <circle cx="52" cy="85" r="32" stroke="rgba(255, 0, 127, 0.3)" stroke-width="1" />
    <circle cx="52" cy="85" r="22" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.7" class="pulse-ring" />
    
    <!-- Radar Sweep Needle -->
    <line x1="52" y1="85" x2="52" y2="45" stroke="#00f0ff" stroke-width="2" class="scan-sweep" />
    <circle cx="52" cy="85" r="4" fill="#00f0ff" filter="url(#neonGlowRGB)" />

    <!-- Class Icon: Controller / Swords Cross -->
    <text x="52" y="90" font-family="'Segoe UI Emoji', sans-serif" font-size="16" text-anchor="middle" fill="#ffffff">⚔️</text>
    
    <!-- Level Badge -->
    <rect x="20" y="134" width="64" height="18" rx="4" fill="rgba(0, 240, 255, 0.15)" stroke="#00f0ff" stroke-width="1" />
    <text x="52" y="147" font-family="'Fira Code', monospace" font-size="9" font-weight="bold" fill="#00f0ff" text-anchor="middle">LVL 99</text>
  </g>

  <!-- Right Side: Player Data & RPG Battlestation Telemetry -->
  <g transform="translate(132, 16)">
    <!-- Top Gamer Tag & Status -->
    <text x="0" y="16" class="gamer-title rgb-glow-text" font-size="18">
      VISHNUPRIYAN <tspan fill="#ff007f" font-size="13">&lt;RGB/&gt;</tspan>
    </text>
    
    <!-- PVP / Co-Op Online Beacon -->
    <rect x="290" y="3" width="94" height="18" rx="4" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="1" />
    <circle cx="300" cy="12" r="3" fill="#10b981" class="beacon-dot" />
    <text x="308" y="16" font-family="'Fira Code', monospace" font-size="8.5" font-weight="bold" fill="#10b981">CO-OP ONLINE</text>

    <!-- Subtitle: Player Class -->
    <text x="0" y="36" class="gamer-sub" fill="#00f0ff">
      CLASS: <tspan fill="#ffffff" font-weight="bold">BACKEND TANK &amp; FULL-STACK ARCHITECT</tspan>
    </text>

    <!-- Combat Stat Matrix -->
    <g transform="translate(0, 48)">
      <!-- PHP / CodeIgniter Core Stat -->
      <rect x="0" y="0" width="88" height="22" rx="4" fill="rgba(0, 240, 255, 0.08)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1" />
      <text x="8" y="15" font-family="'Fira Code', monospace" font-size="9" fill="#94a3b8">ATK: <tspan fill="#00f0ff" font-weight="bold">98 (PHP)</tspan></text>

      <!-- MySQL Defense Stat -->
      <rect x="96" y="0" width="92" height="22" rx="4" fill="rgba(245, 158, 11, 0.08)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1" />
      <text x="104" y="15" font-family="'Fira Code', monospace" font-size="9" fill="#94a3b8">DEF: <tspan fill="#f59e0b" font-weight="bold">95 (SQL)</tspan></text>

      <!-- BotOS / AI Mana Stat -->
      <rect x="196" y="0" width="98" height="22" rx="4" fill="rgba(255, 0, 127, 0.08)" stroke="rgba(255, 0, 127, 0.3)" stroke-width="1" />
      <text x="204" y="15" font-family="'Fira Code', monospace" font-size="9" fill="#94a3b8">MANA: <tspan fill="#ff007f" font-weight="bold">99 (AI)</tspan></text>

      <!-- JS UI Speed Stat -->
      <rect x="302" y="0" width="82" height="22" rx="4" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
      <text x="310" y="15" font-family="'Fira Code', monospace" font-size="9" fill="#94a3b8">SPD: <tspan fill="#10b981" font-weight="bold">94 (JS)</tspan></text>
    </g>

    <!-- Experience Gauge (XP Progress Bar) -->
    <g transform="translate(0, 84)">
      <text x="0" y="10" font-family="'Fira Code', monospace" font-size="9" font-weight="600" fill="#94a3b8">
        EXP PROGRESS: <tspan fill="#f59e0b">9,850 / 10,000 XP</tspan> <tspan fill="#64748b">(NEXT LEVEL: 99.5%)</tspan>
      </text>
      
      <!-- Bar Track -->
      <rect x="0" y="16" width="384" height="8" rx="4" fill="rgba(255, 255, 255, 0.08)" />
      <!-- Glowing Bar Progress -->
      <rect x="0" y="16" width="350" height="8" rx="4" fill="url(#xpBarGradDark)" class="xp-flow" />
    </g>

    <!-- Quest Status / Philosophy -->
    <text x="0" y="128" font-family="'Fira Code', monospace" font-size="9" fill="#64748b">
      &gt; MAIN QUEST: <tspan fill="#00f0ff" font-weight="bold">BotOS Atom AI Action Engine</tspan> &#183; PASSIVE: <tspan fill="#f59e0b">Yali Guardian</tspan>
    </text>
  </g>
</svg>
