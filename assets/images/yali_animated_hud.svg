<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="100%" height="130" fill="none">
  <defs>
    <linearGradient id="hudLaser" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.3" />
      <stop offset="95%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>

    <filter id="svgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .radar-spin {
        transform-origin: 65px 65px;
        animation: spinClockwise 8s linear infinite;
      }
      .radar-counter {
        transform-origin: 65px 65px;
        animation: spinCounter 12s linear infinite;
      }
      .laser-scanner {
        animation: scanUpDown 3s ease-in-out infinite alternate;
      }
      .pulse-text {
        animation: neonPulse 2s ease-in-out infinite alternate;
      }
      .beacon-blink {
        animation: beaconBlink 1.2s ease-in-out infinite alternate;
      }
      .data-glow {
        animation: dataPulse 2.5s ease-in-out infinite alternate;
      }
      @keyframes spinClockwise {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinCounter {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes scanUpDown {
        0% { transform: translateY(-5px); opacity: 0.3; }
        50% { opacity: 0.9; }
        100% { transform: translateY(85px); opacity: 0.3; }
      }
      @keyframes neonPulse {
        0% { filter: drop-shadow(0 0 4px #00f0ff); opacity: 0.85; }
        100% { filter: drop-shadow(0 0 14px #00f0ff) drop-shadow(0 0 20px #0284c7); opacity: 1; }
      }
      @keyframes beaconBlink {
        0% { opacity: 0.2; }
        100% { opacity: 1; filter: drop-shadow(0 0 8px #10b981); }
      }
      @keyframes dataPulse {
        0% { fill: #38bdf8; }
        100% { fill: #f59e0b; }
      }
    </style>
  </defs>

  <!-- HUD Container Card -->
  <rect x="2" y="2" width="496" height="126" rx="10" fill="#050c1c" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.4" />
  
  <!-- Corner Brackets -->
  <path d="M 2 18 L 2 2 L 18 2" stroke="#00f0ff" stroke-width="2.5" />
  <path d="M 482 2 L 498 2 L 498 18" stroke="#00f0ff" stroke-width="2.5" />
  <path d="M 2 112 L 2 128 L 18 128" stroke="#00f0ff" stroke-width="2.5" />
  <path d="M 482 128 L 498 128 L 498 112" stroke="#00f0ff" stroke-width="2.5" />

  <!-- Animated Rotating Radar Reticle on Left -->
  <g>
    <!-- Outer dashed circle -->
    <circle cx="65" cy="65" r="46" stroke="#00f0ff" stroke-width="1.2" stroke-dasharray="8 6" stroke-opacity="0.5" class="radar-spin" />
    <!-- Inner segmented ring -->
    <circle cx="65" cy="65" r="34" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="14 10" stroke-opacity="0.7" class="radar-counter" />
    <circle cx="65" cy="65" r="22" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.6" />
    <!-- Center Core Crosshair -->
    <line x1="65" y1="36" x2="65" y2="94" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4" />
    <line x1="36" y1="65" x2="94" y2="65" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="65" cy="65" r="4" fill="#00f0ff" filter="url(#svgGlow)" />
  </g>

  <!-- Telemetry Content Box on Right -->
  <g transform="translate(130, 18)">
    <!-- Header Title -->
    <text x="0" y="20" font-family="'Fira Code', 'Courier New', monospace" font-size="20" font-weight="bold" fill="#ffffff" class="pulse-text" letter-spacing="3">
      YALI GUARDIAN
    </text>
    
    <!-- Status Badge -->
    <rect x="230" y="6" width="62" height="18" rx="4" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1" />
    <circle cx="240" cy="15" r="3" fill="#10b981" class="beacon-blink" />
    <text x="248" y="19" font-family="'Fira Code', monospace" font-size="9" font-weight="bold" fill="#10b981">ONLINE</text>

    <!-- Subtitle Attributes -->
    <text x="0" y="42" font-family="'Fira Code', monospace" font-size="9.5" font-weight="600" fill="#f59e0b" letter-spacing="1.5">
      STRENGTH &#183; WISDOM &#183; PROTECTION &#183; INNOVATION
    </text>

    <!-- Telemetry Data Rows -->
    <text x="0" y="64" font-family="'Fira Code', monospace" font-size="10" fill="#94a3b8">
      CORE: <tspan fill="#38bdf8" font-weight="bold">ACTIVE</tspan> | FREQ: <tspan class="data-glow" font-weight="bold">4.20 GHz</tspan> | BOTOS: <tspan fill="#10b981" font-weight="bold">SYNCHRONIZED</tspan>
    </text>

    <text x="0" y="82" font-family="'Fira Code', monospace" font-size="9.5" fill="#64748b" letter-spacing="0.8">
      &gt; "Ancient Strength &#215; Modern Technology"
    </text>
  </g>

  <!-- Moving Laser Scanner Overlay across HUD -->
  <g class="laser-scanner">
    <rect x="12" y="15" width="476" height="4" fill="url(#hudLaser)" filter="url(#svgGlow)" />
  </g>
</svg>
