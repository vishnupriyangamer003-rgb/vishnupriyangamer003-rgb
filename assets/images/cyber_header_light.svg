<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" width="100%" height="310" fill="none">
  <defs>
    <!-- Light Mode Esports Gradients -->
    <linearGradient id="mechaBlueViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="35%" stop-color="#7c3aed" />
      <stop offset="70%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="headerBorderLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#7c3aed" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#059669" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="laserBeamLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0" />
      <stop offset="25%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="1" />
      <stop offset="75%" stop-color="#059669" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="scanlineLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="eqBarGradLight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="badgeLightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ede9fe" stop-opacity="0.95" />
    </linearGradient>

    <filter id="lightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="lightGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="rgba(2, 132, 199, 0.08)" stroke-width="1" />
      <circle cx="0" cy="0" r="1.5" fill="rgba(2, 132, 199, 0.25)" />
      <circle cx="18" cy="18" r="0.8" fill="rgba(124, 58, 237, 0.2)" />
    </pattern>

    <style>
      @keyframes glitchTextLight {
        0%, 100% { transform: translate(0, 0); }
        2% { transform: translate(-3px, 1px); }
        4% { transform: translate(3px, -1px); }
        6% { transform: translate(0, 0); }
        50% { transform: translate(0, 0); }
        52% { transform: translate(2px, -2px); }
        54% { transform: translate(-2px, 1px); }
        56% { transform: translate(0, 0); }
      }
      @keyframes glitchBlueGhost {
        0%, 100% { transform: translate(0, 0); opacity: 0.6; }
        2% { transform: translate(-3px, 0); opacity: 0.9; }
        4% { transform: translate(3px, 0); opacity: 0.6; }
        6% { transform: translate(0, 0); opacity: 0.6; }
      }
      @keyframes glitchVioletGhost {
        0%, 100% { transform: translate(0, 0); opacity: 0.6; }
        2% { transform: translate(3px, 0); opacity: 0.9; }
        4% { transform: translate(-3px, 0); opacity: 0.6; }
        6% { transform: translate(0, 0); opacity: 0.6; }
      }
      @keyframes verticalSweepLight {
        0% { transform: translateY(-40px); opacity: 0; }
        15% { opacity: 0.85; }
        85% { opacity: 0.85; }
        100% { transform: translateY(350px); opacity: 0; }
      }
      @keyframes spinCWL {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinCCWL {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes pulseGlowBeamLight {
        0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 3px #0284c7); }
        50% { opacity: 1; filter: drop-shadow(0 0 12px #0284c7) drop-shadow(0 0 20px #7c3aed); }
      }
      @keyframes beaconBlinkLight {
        0%, 100% { opacity: 0.4; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.15); filter: drop-shadow(0 0 8px #059669); }
      }
      @keyframes dataStreamTravelL {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }

      /* Audio Equalizer animations */
      @keyframes eqL1 { 0%, 100% { height: 12px; y: 284px; } 50% { height: 38px; y: 258px; } }
      @keyframes eqL2 { 0%, 100% { height: 28px; y: 268px; } 50% { height: 8px;  y: 288px; } }
      @keyframes eqL3 { 0%, 100% { height: 18px; y: 278px; } 50% { height: 46px; y: 250px; } }
      @keyframes eqL4 { 0%, 100% { height: 36px; y: 260px; } 50% { height: 15px; y: 281px; } }
      @keyframes eqL5 { 0%, 100% { height: 10px; y: 286px; } 50% { height: 42px; y: 254px; } }

      .main-title-light {
        font-family: 'Rajdhani', 'Outfit', 'Segoe UI', 'Impact', sans-serif;
        font-weight: 900;
        letter-spacing: 14px;
        text-anchor: middle;
      }
      .mono-txt {
        font-family: 'Fira Code', 'Courier New', monospace;
      }
      .anim-glitch-light { animation: glitchTextLight 3.5s infinite; }
      .anim-glitch-blue { animation: glitchBlueGhost 3.5s infinite; }
      .anim-glitch-violet { animation: glitchVioletGhost 3.5s infinite; }
      .anim-pulse-beam-light { animation: pulseGlowBeamLight 2.5s ease-in-out infinite; }
      .anim-beacon-light { animation: beaconBlinkLight 1.4s infinite; }
      .anim-sweep-light { animation: verticalSweepLight 4.5s linear infinite; }
      .anim-data-flow-light { stroke-dasharray: 40 120; animation: dataStreamTravelL 3s linear infinite; }

      .spin-cw-l1 { transform-origin: 90px 155px; animation: spinCWL 12s linear infinite; }
      .spin-ccw-l1 { transform-origin: 90px 155px; animation: spinCCWL 8s linear infinite; }
      .spin-cw-r1 { transform-origin: 910px 155px; animation: spinCWL 14s linear infinite; }
      .spin-ccw-r1 { transform-origin: 910px 155px; animation: spinCCWL 9s linear infinite; }

      .eq-l1 { animation: eqL1 0.8s ease-in-out infinite alternate; }
      .eq-l2 { animation: eqL2 0.7s ease-in-out infinite alternate; }
      .eq-l3 { animation: eqL3 0.9s ease-in-out infinite alternate; }
      .eq-l4 { animation: eqL4 0.65s ease-in-out infinite alternate; }
      .eq-l5 { animation: eqL5 0.85s ease-in-out infinite alternate; }
    </style>
  </defs>

  <!-- Clean Mecha Titanium Base Container -->
  <rect x="2" y="2" width="996" height="306" rx="16" fill="#f8fafc" />
  
  <radialGradient id="vignetteGradLight" cx="50%" cy="50%" r="55%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
    <stop offset="70%" stop-color="#f1f5f9" stop-opacity="0.95" />
    <stop offset="100%" stop-color="#e2e8f0" stop-opacity="1" />
  </radialGradient>
  <rect x="2" y="2" width="996" height="306" rx="16" fill="url(#vignetteGradLight)" />

  <!-- High-Tech Light Grid Overlay -->
  <rect x="2" y="2" width="996" height="306" rx="16" fill="url(#lightGrid)" />

  <!-- Laser Scanline Sweep -->
  <g class="anim-sweep-light">
    <rect x="4" y="0" width="992" height="45" fill="url(#scanlineLight)" />
    <line x1="4" y1="22" x2="996" y2="22" stroke="#0284c7" stroke-width="1.8" stroke-opacity="0.7" />
  </g>

  <!-- Outer Cyber Frame with Chamfered Corners -->
  <path d="M 36 2 L 964 2 L 998 36 L 998 274 L 964 308 L 36 308 L 2 274 L 2 36 Z" 
        fill="none" stroke="url(#headerBorderLight)" stroke-width="2.4" filter="url(#lightGlow)" />

  <!-- Tech Accent Data Flow Guides -->
  <path d="M 50 2 L 950 2" stroke="#0284c7" stroke-width="1.5" class="anim-data-flow-light" />
  <path d="M 950 308 L 50 308" stroke="#7c3aed" stroke-width="1.5" class="anim-data-flow-light" />

  <!-- Corner Brackets & Mecha Chamfer Accents -->
  <!-- Top Left -->
  <path d="M 12 44 L 44 12" stroke="#0284c7" stroke-width="3.5" />
  <path d="M 6 52 L 52 6" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="3 3" />
  <circle cx="48" cy="16" r="2.5" fill="#0284c7" />
  <!-- Top Right -->
  <path d="M 988 44 L 956 12" stroke="#0284c7" stroke-width="3.5" />
  <path d="M 994 52 L 948 6" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="3 3" />
  <circle cx="952" cy="16" r="2.5" fill="#0284c7" />
  <!-- Bottom Left -->
  <path d="M 12 266 L 44 298" stroke="#7c3aed" stroke-width="3.5" />
  <circle cx="48" cy="294" r="2.5" fill="#7c3aed" />
  <!-- Bottom Right -->
  <path d="M 988 266 L 956 298" stroke="#0284c7" stroke-width="3.5" />
  <circle cx="952" cy="294" r="2.5" fill="#0284c7" />

  <!-- Top System Telemetry HUD Bar -->
  <g transform="translate(38, 28)">
    <rect x="-8" y="-14" width="220" height="22" rx="4" fill="rgba(2, 132, 199, 0.08)" stroke="#0284c7" stroke-width="1" />
    <text x="0" y="2" class="mono-txt" font-size="11" font-weight="700" fill="#0284c7" letter-spacing="1.2">
      &gt; CALLSIGN: <tspan fill="#0f172a" font-weight="800">gamer003-rgb</tspan>
    </text>

    <!-- Center System Status Stream -->
    <text x="240" y="2" class="mono-txt" font-size="11" font-weight="700" fill="#475569" letter-spacing="1">
      <tspan fill="#7c3aed">|</tspan> BATTLESTATION: <tspan fill="#0284c7">4.20 GHz</tspan> <tspan fill="#7c3aed">|</tspan> XP: <tspan fill="#d97706">9,999/10,000</tspan> <tspan fill="#7c3aed">|</tspan> LVL: <tspan fill="#059669">99 MAX</tspan>
    </text>

    <!-- Top Right Pulsing Beacon -->
    <g transform="translate(780, -2)">
      <circle cx="0" cy="0" r="5" fill="#059669" class="anim-beacon-light" />
      <circle cx="0" cy="0" r="12" stroke="#059669" stroke-width="1.2" fill="none">
        <animate attributeName="r" values="4;18" dur="1.8s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1;0" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="16" y="4" class="mono-txt" font-size="10.5" font-weight="800" fill="#059669" letter-spacing="1.5">
        LIVE MATRIX: ONLINE
      </text>
    </g>
  </g>

  <!-- Left Rotating HUD Reticle -->
  <g>
    <circle cx="90" cy="155" r="54" stroke="rgba(2, 132, 199, 0.2)" stroke-width="1" stroke-dasharray="6 4" />
    <circle cx="90" cy="155" r="44" stroke="#0284c7" stroke-width="2" stroke-dasharray="16 8 4 8" class="spin-cw-l1" />
    <circle cx="90" cy="155" r="30" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="14 10" class="spin-ccw-l1" />
    
    <line x1="90" y1="112" x2="90" y2="198" stroke="rgba(2, 132, 199, 0.35)" stroke-width="1" />
    <line x1="47" y1="155" x2="133" y2="155" stroke="rgba(2, 132, 199, 0.35)" stroke-width="1" />
    <circle cx="90" cy="155" r="4.5" fill="#0284c7" />
    
    <rect x="52" y="218" width="76" height="18" rx="4" fill="rgba(2, 132, 199, 0.12)" stroke="#0284c7" stroke-width="1.2" />
    <text x="90" y="231" class="mono-txt" font-size="9" font-weight="800" fill="#0284c7" text-anchor="middle" letter-spacing="1">RADAR LOCK</text>
  </g>

  <!-- Right Rotating HUD Reticle -->
  <g>
    <circle cx="910" cy="155" r="54" stroke="rgba(124, 58, 237, 0.2)" stroke-width="1" stroke-dasharray="6 4" />
    <circle cx="910" cy="155" r="44" stroke="#7c3aed" stroke-width="2" stroke-dasharray="16 8 4 8" class="spin-cw-r1" />
    <circle cx="910" cy="155" r="30" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="14 10" class="spin-ccw-r1" />
    
    <line x1="910" y1="112" x2="910" y2="198" stroke="rgba(124, 58, 237, 0.35)" stroke-width="1" />
    <line x1="867" y1="155" x2="953" y2="155" stroke="rgba(124, 58, 237, 0.35)" stroke-width="1" />
    <circle cx="910" cy="155" r="4.5" fill="#7c3aed" />
    
    <rect x="866" y="218" width="88" height="18" rx="4" fill="rgba(124, 58, 237, 0.12)" stroke="#7c3aed" stroke-width="1.2" />
    <text x="910" y="231" class="mono-txt" font-size="9" font-weight="800" fill="#7c3aed" text-anchor="middle" letter-spacing="1">ATOM AI BUS</text>
  </g>

  <!-- Centerpiece: Glitch Esports Title -->
  <g transform="translate(500, 125)">
    <!-- Blue Ghost -->
    <text x="-4" y="0" class="main-title-light anim-glitch-blue" font-size="62" fill="#0284c7" opacity="0.7">
      VISHNUPRIYAN
    </text>
    <!-- Violet Ghost -->
    <text x="4" y="0" class="main-title-light anim-glitch-violet" font-size="62" fill="#7c3aed" opacity="0.7">
      VISHNUPRIYAN
    </text>
    <!-- Main High-Contrast Text -->
    <text x="0" y="0" class="main-title-light anim-glitch-light" font-size="62" fill="#0f172a">
      VISHNUPRIYAN
    </text>

    <!-- Pulsing Divider -->
    <g class="anim-pulse-beam-light">
      <line x1="-340" y1="24" x2="340" y2="24" stroke="url(#laserBeamLight)" stroke-width="3" />
      <polygon points="0,18 -10,24 0,30 10,24" fill="#0284c7" />
      <circle cx="-170" cy="24" r="3.5" fill="#0284c7" />
      <circle cx="170" cy="24" r="3.5" fill="#7c3aed" />
    </g>

    <!-- Subtitle Role Stream -->
    <text x="0" y="52" class="mono-txt" font-size="12" font-weight="800" fill="#0284c7" text-anchor="middle" letter-spacing="2">
      LEVEL 99 SENIOR FULL-STACK ARCHITECT <tspan fill="#7c3aed">•</tspan> PHP CORE <tspan fill="#7c3aed">•</tspan> AI SOLUTIONS
    </text>

    <!-- Tech & Combat Badges -->
    <g transform="translate(0, 78)">
      <g transform="translate(-270, 0)">
        <rect x="0" y="0" width="165" height="26" rx="6" fill="url(#badgeLightBg)" stroke="#7c3aed" stroke-width="1.4" />
        <text x="82.5" y="17.5" class="mono-txt" font-size="10.5" font-weight="800" fill="#6d28d9" text-anchor="middle" letter-spacing="0.5">
          &#9876; BACKEND TANK
        </text>
      </g>
      <g transform="translate(-90, 0)">
        <rect x="0" y="0" width="180" height="26" rx="6" fill="url(#badgeLightBg)" stroke="#0284c7" stroke-width="1.4" />
        <text x="90" y="17.5" class="mono-txt" font-size="10.5" font-weight="800" fill="#0369a1" text-anchor="middle" letter-spacing="0.5">
          &#129302; QUEST: BotOS ACTION BUS
        </text>
      </g>
      <g transform="translate(105, 0)">
        <rect x="0" y="0" width="165" height="26" rx="6" fill="url(#badgeLightBg)" stroke="#059669" stroke-width="1.4" />
        <text x="82.5" y="17.5" class="mono-txt" font-size="10.5" font-weight="800" fill="#047857" text-anchor="middle" letter-spacing="0.5">
          &#128006; YALI PHILOSOPHY
        </text>
      </g>
    </g>
  </g>

  <!-- Bottom Animated 32-Bar Audio Spectrum Equalizer -->
  <g transform="translate(140, 0)">
    <line x1="0" y1="298" x2="720" y2="298" stroke="rgba(2, 132, 199, 0.25)" stroke-width="1" />
    
    <rect x="10"  y="280" width="12" height="18" rx="2.5" fill="url(#eqBarGradLight)" class="eq-l1" />
    <rect x="32"  y="272" width="12" height="26" rx="2.5" fill="url(#eqBarGradLight)" class="eq-l2" />
    <rect x="54"  y="285" width="12" height="13" rx="2.5" fill="url(#eqBarGradLight)" class="eq-l3" />
    <rect x="76"  y="266" width="12" height="32" rx="2.5" fill="url(#eqBarGradLight)" class="eq-l4" />
    <rect x="98"  y="276" width="12" height="22" rx="2.5" fill="url(#eqBarGradLight)" class="eq-l5" />
    <rect x="120" y="260" width="12" height="38" rx="2.5" fill="url(#eqBarGradLight)" class="eq-l1" />
    <rect x="142" y="282" width="12" height="16" rx="2.5" fill="url(#eqBarGradLight)" class="eq-l2" />
    <rect x="164" y="270" width="12" height="28" rx="2.5" fill="url(#eqBarGradLight)" class="eq-l3" />
    <rect x="186" y="278" width="12" height="20" rx="2.5" fill="url(#eqBarGradLight)" class="eq-l4" />
    <rect x="208" y="258" width="12" height="40" rx="2.5" fill="url(#eqBarGradLight)" class="eq-l5" />
    <rect x="230" y="284" width="12" height="14" rx="2.5" fill="url(#eqBarGradLight)" class="eq-l1" />
    <rect x="252" y="268" width="12" height="30" rx="2.5" fill="url(#eqBarGradLight)" class="eq-l2" />
    <rect x="274" y="274" width="12" height="24" rx="2.5" fill="url(#eqBarGradLight)" class="eq-l3" />
    <rect x="296" y="254" width="12" height="44" rx="2.5" fill="url(#eqBarGradLight)" class="eq-l4" />
    <rect x="318" y="250" width="12" height="48" rx="2.5" fill="url(#eqBarGradLight)" class="eq-l5" />
    <rect x="340" y="262" width="12" height="36" rx="2.5" fill="url(#eqBarGradLight)" class="eq-l1" />
    <rect x="362" y="262" width="12" height="36" rx="2.5" fill="url(#eqBarGradLight)" class="eq-l1" />
    <rect x="384" y="250" width="12" height="48" rx="2.5" fill="url(#eqBarGradLight)" class="eq-l5" />
    <rect x="406" y="254" width="12" height="44" rx="2.5" fill="url(#eqBarGradLight)" class="eq-l4" />
    <rect x="428" y="274" width="12" height="24" rx="2.5" fill="url(#eqBarGradLight)" class="eq-l3" />
    <rect x="450" y="268" width="12" height="30" rx="2.5" fill="url(#eqBarGradLight)" class="eq-l2" />
    <rect x="472" y="284" width="12" height="14" rx="2.5" fill="url(#eqBarGradLight)" class="eq-l1" />
    <rect x="494" y="258" width="12" height="40" rx="2.5" fill="url(#eqBarGradLight)" class="eq-l5" />
    <rect x="516" y="278" width="12" height="20" rx="2.5" fill="url(#eqBarGradLight)" class="eq-l4" />
    <rect x="538" y="270" width="12" height="28" rx="2.5" fill="url(#eqBarGradLight)" class="eq-l3" />
    <rect x="560" y="282" width="12" height="16" rx="2.5" fill="url(#eqBarGradLight)" class="eq-l2" />
    <rect x="582" y="260" width="12" height="38" rx="2.5" fill="url(#eqBarGradLight)" class="eq-l1" />
    <rect x="604" y="276" width="12" height="22" rx="2.5" fill="url(#eqBarGradLight)" class="eq-l5" />
    <rect x="626" y="266" width="12" height="32" rx="2.5" fill="url(#eqBarGradLight)" class="eq-l4" />
    <rect x="648" y="285" width="12" height="13" rx="2.5" fill="url(#eqBarGradLight)" class="eq-l3" />
    <rect x="670" y="272" width="12" height="26" rx="2.5" fill="url(#eqBarGradLight)" class="eq-l2" />
    <rect x="692" y="280" width="12" height="18" rx="2.5" fill="url(#eqBarGradLight)" class="eq-l1" />
  </g>
</svg>
