<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="100%" height="120" fill="none">
  <defs>
    <linearGradient id="footerWaveGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#7c3aed" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#059669" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="footerGlowLineLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="waveGlowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes footerWaveFlowL {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      @keyframes footerPulseL {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      .anim-wave-l { animation: footerWaveFlowL 4s ease-in-out infinite; }
      .anim-pulse-l { animation: footerPulseL 2.5s ease-in-out infinite; }
      .footer-txt-light {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2px;
        text-anchor: middle;
      }
    </style>
  </defs>

  <path d="M 0 45 Q 250 5 500 40 T 1000 30 L 1000 120 L 0 120 Z" fill="url(#footerWaveGradLight)" opacity="0.25" class="anim-wave-l" />
  <path d="M 0 55 Q 250 85 500 50 T 1000 60 L 1000 120 L 0 120 Z" fill="#ffffff" opacity="0.9" />
  
  <path d="M 0 50 Q 250 15 500 45 T 1000 35" stroke="url(#footerGlowLineLight)" stroke-width="2.5" fill="none" filter="url(#waveGlowLight)" class="anim-pulse-l" />

  <line x1="100" y1="95" x2="900" y2="95" stroke="rgba(2, 132, 199, 0.2)" stroke-width="1" />
  <circle cx="500" cy="95" r="4" fill="#0284c7" />
  <circle cx="300" cy="95" r="2.5" fill="#7c3aed" />
  <circle cx="700" cy="95" r="2.5" fill="#059669" />

  <text x="500" y="82" fill="#0284c7" class="footer-txt-light">
    &gt;&gt; TRANSMISSION COMPLETE // LEVEL 99 FULL-STACK DEVELOPER // GAMER003-RGB &lt;&lt;
  </text>
</svg>
